name: privileged-review
on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: none

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm ci
      - run: npm test
