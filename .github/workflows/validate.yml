name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python validator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run clean source-tree Core tests before installation
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -p "test_*.py" -q

      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/dist"
          python -c "from pathlib import Path; import os; d=Path(os.environ['RUNNER_TEMP'])/'dist'; assert len(list(d.glob('*.whl')))==1; assert len(list(d.glob('*.tar.gz')))==1"

      - name: Smoke-test wheel and source distribution installs
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP"/dist/*.whl
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-venv/bin/scan" doctor "$GITHUB_WORKSPACE" --json > doctor-wheel.json)
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP"/dist/*.tar.gz
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/sdist-venv/bin/scan" doctor "$GITHUB_WORKSPACE" --json > doctor-sdist.json)
          python -c "import json,os; from pathlib import Path; r=Path(os.environ['RUNNER_TEMP']); assert json.load(open(r/'doctor-wheel.json'))['overall'] in ('pass','warn'); assert json.load(open(r/'doctor-sdist.json'))['overall'] in ('pass','warn')"

      - name: Install Scan package
        run: python -m pip install --disable-pip-version-check .

      - name: Compile package, tests, validator and demo generator
        run: |
          python -m compileall -q src/scan_core tests
          python -m py_compile scripts/validate_report.py scripts/test_validate_report.py scripts/build_demo_report.py

      - name: Run frozen Scan 1.2 validator contract tests
        run: python -B -m unittest discover -s scripts -p "test_*.py" -v

      - name: Run Scan Core tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify packaged CLI
        run: |
          scan --version
          scan doctor . --json > "$RUNNER_TEMP/doctor.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); assert d['overall'] in ('pass','warn'); assert any(c['id']=='schema-1.4' and c['status']=='pass' for c in d['checks'])" "$RUNNER_TEMP/doctor.json"
          scan validate examples/demo-report.html
          scan scanbench/fixtures/inventory-basic/target --offline --state "$RUNNER_TEMP/scan-state.json" --output "$RUNNER_TEMP/scan-report.html" --quiet
          scan validate "$RUNNER_TEMP/scan-state.json"
          scan validate "$RUNNER_TEMP/scan-report.html"
          scan render "$RUNNER_TEMP/scan-state.json" --output "$RUNNER_TEMP/scan-rerendered.html"
          scan validate "$RUNNER_TEMP/scan-rerendered.html"
          scan schema --version 1.4 > "$RUNNER_TEMP/scan-state-1.4.schema.json"
          python -c "import json,sys; s=json.load(open(sys.argv[1], encoding='utf-8')); assert s['properties']['schema_version']['const']=='1.4'" "$RUNNER_TEMP/scan-state-1.4.schema.json"
          mkdir -p "$RUNNER_TEMP/repeat-project"
          printf 'one' > "$RUNNER_TEMP/repeat-project/app.txt"
          (cd "$RUNNER_TEMP/repeat-project" && scan . --offline --quiet)
          cp "$RUNNER_TEMP/repeat-project/.scan/state.json" "$RUNNER_TEMP/first-state.json"
          printf 'two' > "$RUNNER_TEMP/repeat-project/app.txt"
          (cd "$RUNNER_TEMP/repeat-project" && scan . --offline --quiet)
          scan compare "$RUNNER_TEMP/first-state.json" "$RUNNER_TEMP/repeat-project/.scan/state.json" --json > "$RUNNER_TEMP/compare.json"
          python -c "import json,sys; s=json.load(open(sys.argv[1], encoding='utf-8')); assert s['snapshot_relation']=='changed'; assert len(s['artifacts']['changed'])==1" "$RUNNER_TEMP/compare.json"
          scan egress scanbench/fixtures/privacy-redaction/target --privacy controlled-remote --redact strict --sensitive-path "private/**" --json
          scan bench

      - name: Verify reproducible synthetic report
        run: |
          python -B scripts/build_demo_report.py --check
          python -B scripts/validate_report.py examples/demo-report.html

      - name: Run synthetic fixture unit tests
        run: python -B -m unittest discover -s examples/demo-project/tests -p "test_*.py" -v

  report-visual:
    name: Static report browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and optional browser tooling
        run: |
          python -m pip install . playwright
          python -m playwright install --with-deps chromium
      - name: Build representative current reports
        run: python scripts/build_report_review.py --output "$RUNNER_TEMP/report-review/reports" --self-scan
      - name: Check five widths, keyboard, links and closed-details print
        run: python scripts/capture_preview.py "$RUNNER_TEMP"/report-review/reports/*.html --output "$RUNNER_TEMP/report-review/captures"
      - name: Preserve owner review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-review
          path: ${{ runner.temp }}/report-review
          retention-days: 14

  mcp-integration:
    name: Optional MCP bridge / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Scan wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps . --wheel-dir "$RUNNER_TEMP/wheelhouse"

      - name: Install wheel with MCP extra
        run: |
          python -c "from pathlib import Path; import os,subprocess,sys; w=next((Path(os.environ['RUNNER_TEMP'])/'wheelhouse').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check',str(w)+'[mcp]'])"

      - name: Verify packaged MCP bridge, semantic continuation and portable setup
        run: |
          scan-mcp --help
          scan-mcp doctor . --json
          scan-mcp config codex .
          scan-mcp config claude-desktop .
          scan-mcp config claude-code .
          scan-mcp config cursor .
          scan-mcp config vscode .
          python -c "import subprocess; s=subprocess.check_output(['scan-mcp','config','codex','.'], text=True); assert 'scan_core.mcp_app' in s; assert 'scan_core.mcp_server' not in s"
          python -B -m unittest discover -s tests -p "test_mcp*.py" -v

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Scan package
        run: python -m pip install --disable-pip-version-check .

      - name: Run packaged core and ScanBench gates
        run: |
          python -B -m unittest discover -s tests -p "test_*.py" -q
          scan bench
          scan schema --version 1.4 > /tmp/scan-schema.json

  cross-platform:
    name: ${{ matrix.os }} / Python 3.12 release gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps . --wheel-dir wheelhouse

      - name: Install built wheel
        id: install-wheel
        run: python -c "from pathlib import Path; import subprocess,sys; w=next(Path('wheelhouse').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check','--force-reinstall','--no-deps',str(w)])"

      - name: Verify installed console entrypoint and SARIF export
        run: |
          scan --version
          scan doctor . --json
          python -c "import json,pathlib,subprocess,tempfile; d=pathlib.Path(tempfile.mkdtemp()); state=d/'state.json'; sarif=d/'scan.sarif'; subprocess.run(['scan','.', '--offline','--baseline','none','--no-html','--state',str(state),'--quiet'],check=True); subprocess.run(['scan','sarif',str(state),'--output',str(sarif)],check=True); p=json.loads(sarif.read_text(encoding='utf-8')); assert p['version']=='2.1.0' and len(p['runs'])==1 and isinstance(p['runs'][0]['results'],list); print('SARIF_CLI_SMOKE=PASS')"

      - name: Verify reusable GitHub Action receipts
        id: scan-action
        uses: ./
        with:
          path: scanbench/fixtures/clean-minimal/project
          baseline: none
          job-summary: "false"

      - name: Check reusable GitHub Action outputs
        shell: python
        env:
          SCAN_STATE: ${{ steps.scan-action.outputs.state }}
          SCAN_REPORT: ${{ steps.scan-action.outputs.report }}
          SCAN_SARIF: ${{ steps.scan-action.outputs.sarif }}
          SCAN_SUMMARY: ${{ steps.scan-action.outputs.summary }}
          SCAN_FINDINGS: ${{ steps.scan-action.outputs['findings-count'] }}
          SCAN_ANALYSIS_COMPLETE: ${{ steps.scan-action.outputs['analysis-complete'] }}
          SCAN_DELTA_AVAILABLE: ${{ steps.scan-action.outputs['delta-available'] }}
          SCAN_ARTIFACTS_ADDED: ${{ steps.scan-action.outputs['artifacts-added'] }}
        run: |
          import json
          import os
          from pathlib import Path
          paths = [Path(os.environ[name]) for name in ("SCAN_STATE", "SCAN_REPORT", "SCAN_SARIF", "SCAN_SUMMARY")]
          assert all(path.is_file() for path in paths), paths
          sarif = json.loads(Path(os.environ["SCAN_SARIF"]).read_text(encoding="utf-8"))
          assert sarif["version"] == "2.1.0"
          assert os.environ["SCAN_FINDINGS"] == "0"
          assert os.environ["SCAN_ANALYSIS_COMPLETE"] == "false"
          assert os.environ["SCAN_DELTA_AVAILABLE"] == "false"
          assert os.environ["SCAN_ARTIFACTS_ADDED"] == ""
          assert not Path("scanbench/fixtures/clean-minimal/project/.scan").exists()
          print("GITHUB_ACTION_SMOKE=PASS")

      - name: Install optional MCP extra from built wheel
        run: python -c "from pathlib import Path; import subprocess,sys; w=next(Path('wheelhouse').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check',str(w)+'[mcp]'])"

      - name: Verify portable MCP setup and full application on native platform
        run: |
          scan-mcp doctor . --json
          scan-mcp config codex .
          scan-mcp config claude-desktop .
          scan-mcp config claude-code .
          scan-mcp config cursor .
          scan-mcp config vscode .
          python -c "import subprocess; s=subprocess.check_output(['scan-mcp','config','codex','.'], text=True); assert 'scan_core.mcp_app' in s; assert 'scan_core.mcp_server' not in s"

      - name: Run full Core suite on native filesystem
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Run ScanBench v1 on native filesystem
        if: ${{ !cancelled() && steps.install-wheel.outcome == 'success' }}
        run: scan bench

      - name: Run installed v0.3 acceptance matrix
        if: ${{ !cancelled() && steps.install-wheel.outcome == 'success' }}
        run: python scripts/v03_acceptance.py
