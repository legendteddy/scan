name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python validator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run clean source-tree Core tests before installation
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -p "test_*.py" -q

      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/dist"
          python -c "from pathlib import Path; import os; d=Path(os.environ['RUNNER_TEMP'])/'dist'; assert len(list(d.glob('*.whl')))==1; assert len(list(d.glob('*.tar.gz')))==1"

      - name: Smoke-test wheel and source distribution installs
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP"/dist/*.whl
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-venv/bin/scan" doctor "$GITHUB_WORKSPACE" --json > doctor-wheel.json)
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-venv/bin/scan-bundle" --help > scan-bundle-wheel.txt)
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-venv/bin/scan" handoff --help > /dev/null)
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-venv/bin/scan" import-evidence --help > /dev/null)
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-venv/bin/scan" import-observed --help > /dev/null)
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP"/dist/*.tar.gz
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/sdist-venv/bin/scan" doctor "$GITHUB_WORKSPACE" --json > doctor-sdist.json)
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/sdist-venv/bin/scan-bundle" --help > scan-bundle-sdist.txt)
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/sdist-venv/bin/scan" handoff --help > /dev/null)
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/sdist-venv/bin/scan" import-evidence --help > /dev/null)
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/sdist-venv/bin/scan" import-observed --help > /dev/null)
          python -c "import json,os; from pathlib import Path; r=Path(os.environ['RUNNER_TEMP']); assert json.load(open(r/'doctor-wheel.json'))['overall'] in ('pass','warn'); assert json.load(open(r/'doctor-sdist.json'))['overall'] in ('pass','warn'); assert 'create' in (r/'scan-bundle-wheel.txt').read_text(); assert 'verify' in (r/'scan-bundle-sdist.txt').read_text()"

      - name: Install Scan package
        run: python -m pip install --disable-pip-version-check .

      - name: Compile package, tests, validator and demo generator
        run: |
          python -m compileall -q src/scan_core tests
          python -m py_compile scripts/validate_report.py scripts/test_validate_report.py scripts/build_demo_report.py scripts/v06_acceptance.py

      - name: Run frozen Scan 1.2 validator contract tests
        run: python -B -m unittest discover -s scripts -p "test_*.py" -v

      - name: Run Scan Core tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify packaged CLI
        run: |
          scan --version
          scan-bundle --help
          scan doctor . --json > "$RUNNER_TEMP/doctor.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); assert d['overall'] in ('pass','warn'); assert any(c['id']=='schema-1.4' and c['status']=='pass' for c in d['checks'])" "$RUNNER_TEMP/doctor.json"
          scan validate examples/demo-report.html
          scan scanbench/fixtures/inventory-basic/target --offline --state "$RUNNER_TEMP/scan-state.json" --output "$RUNNER_TEMP/scan-report.html" --quiet
          scan validate "$RUNNER_TEMP/scan-state.json"
          scan validate "$RUNNER_TEMP/scan-report.html"
          scan render "$RUNNER_TEMP/scan-state.json" --output "$RUNNER_TEMP/scan-rerendered.html"
          scan validate "$RUNNER_TEMP/scan-rerendered.html"
          scan schema --version 1.4 > "$RUNNER_TEMP/scan-state-1.4.schema.json"
          python -c "import json,sys; s=json.load(open(sys.argv[1], encoding='utf-8')); assert s['properties']['schema_version']['const']=='1.4'" "$RUNNER_TEMP/scan-state-1.4.schema.json"
          mkdir -p "$RUNNER_TEMP/repeat-project"
          printf 'one' > "$RUNNER_TEMP/repeat-project/app.txt"
          (cd "$RUNNER_TEMP/repeat-project" && scan . --offline --quiet)
          cp "$RUNNER_TEMP/repeat-project/.scan/state.json" "$RUNNER_TEMP/first-state.json"
          printf 'two' > "$RUNNER_TEMP/repeat-project/app.txt"
          (cd "$RUNNER_TEMP/repeat-project" && scan . --offline --quiet)
          scan compare "$RUNNER_TEMP/first-state.json" "$RUNNER_TEMP/repeat-project/.scan/state.json" --json > "$RUNNER_TEMP/compare.json"
          python -c "import json,sys; s=json.load(open(sys.argv[1], encoding='utf-8')); assert s['snapshot_relation']=='changed'; assert len(s['artifacts']['changed'])==1" "$RUNNER_TEMP/compare.json"
          scan egress scanbench/fixtures/privacy-redaction/target --privacy controlled-remote --redact strict --sensitive-path "private/**" --json
          scan bench

      - name: Verify reproducible synthetic report
        run: |
          python -B scripts/build_demo_report.py --check
          python -B scripts/validate_report.py examples/demo-report.html

      - name: Run synthetic fixture unit tests
        run: python -B -m unittest discover -s examples/demo-project/tests -p "test_*.py" -v

  report-visual:
    name: Static report browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package and optional browser tooling
        run: |
          python -m pip install . playwright
          python -m playwright install --with-deps chromium
      - name: Build representative current reports
        run: python scripts/build_report_review.py --output "$RUNNER_TEMP/report-review/reports" --self-scan
      - name: Check five widths, keyboard, links and closed-details print
        run: python scripts/capture_preview.py "$RUNNER_TEMP"/report-review/reports/*.html --output "$RUNNER_TEMP/report-review/captures"
      - name: Preserve owner review artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report-review
          path: ${{ runner.temp }}/report-review
          retention-days: 14

  mcp-integration:
    name: Optional MCP bridge / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build Scan wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps . --wheel-dir "$RUNNER_TEMP/wheelhouse"

      - name: Install wheel with MCP extra
        run: |
          python -c "from pathlib import Path; import os,subprocess,sys; w=next((Path(os.environ['RUNNER_TEMP'])/'wheelhouse').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check',str(w)+'[mcp]'])"

      - name: Verify packaged MCP bridge, semantic continuation and portable setup
        run: |
          scan-mcp --help
          scan-mcp doctor . --json
          scan-mcp config codex .
          scan-mcp config claude-desktop .
          scan-mcp config claude-code .
          scan-mcp config cursor .
          scan-mcp config vscode .
          python -c "import subprocess; s=subprocess.check_output(['scan-mcp','config','codex','.'], text=True); assert 'scan_core.mcp_app' in s; assert 'scan_core.mcp_server' not in s"
          python -B -m unittest discover -s tests -p "test_mcp*.py" -v

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Scan package
        run: python -m pip install --disable-pip-version-check .

      - name: Run packaged core and ScanBench gates
        run: |
          python -B -m unittest discover -s tests -p "test_*.py" -q
          scan-bundle --help
          scan handoff --help
          scan import-evidence --help
          scan import-observed --help
          scan bench
          scan schema --version 1.4 > /tmp/scan-schema.json

  cross-platform:
    name: ${{ matrix.os }} / Python 3.12 release gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps . --wheel-dir wheelhouse

      - name: Install built wheel
        id: install-wheel
        run: python -c "from pathlib import Path; import subprocess,sys; w=next(Path('wheelhouse').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check','--force-reinstall','--no-deps',str(w)])"

      - name: Verify installed console entrypoint and SARIF export
        run: |
          python -c "import importlib.metadata as m, scan_core.cli as c, shutil, subprocess; from scan_core.version import __version__; exe=shutil.which('scan'); assert exe; assert __version__ == m.version('scan-skill'); assert {'handoff','import-evidence','import-observed'} <= c.UTILITY_COMMANDS; assert subprocess.check_output([exe,'--version'], text=True).strip() == f'scan {__version__}'; print('INSTALLED_SCAN_MODULE=' + c.__file__); print('INSTALLED_SCAN_ENTRYPOINT=' + exe); print('INSTALLED_SCAN_VERSION=' + __version__)"
          scan --version
          scan doctor . --json
          python -c "import json,pathlib,subprocess,tempfile; d=pathlib.Path(tempfile.mkdtemp()); state=d/'state.json'; sarif=d/'scan.sarif'; subprocess.run(['scan','.', '--offline','--baseline','none','--no-html','--state',str(state),'--quiet'],check=True); subprocess.run(['scan','sarif',str(state),'--output',str(sarif)],check=True); p=json.loads(sarif.read_text(encoding='utf-8')); assert p['version']=='2.1.0' and len(p['runs'])==1 and isinstance(p['runs'][0]['results'],list); print('SARIF_CLI_SMOKE=PASS')"

      - name: Verify installed Inspection Bundle CLI
        shell: python
        run: |
          import json
          from pathlib import Path
          import subprocess
          import tempfile
          root = Path(tempfile.mkdtemp())
          project = root / "project"
          project.mkdir()
          (project / "app.py").write_text("print('bundle')\n", encoding="utf-8")
          state = root / "state.json"
          bundle = root / "inspection.scanbundle"
          subprocess.run(["scan", str(project), "--offline", "--baseline", "none", "--no-html", "--state", str(state), "--quiet"], check=True)
          created = json.loads(subprocess.check_output(["scan-bundle", "create", str(state), "--output", str(bundle), "--json"], text=True))
          verified = json.loads(subprocess.check_output(["scan-bundle", "verify", str(bundle), "--json"], text=True))
          assert bundle.is_file()
          assert verified["verified"] is True
          assert verified["bundle_digest"] == created["bundle_digest"]
          assert verified["state_digest"] == created["state_digest"]
          assert verified["handoff_digest"] == created["handoff_digest"]
          assert verified["target_executed"] is False
          assert verified["network_used"] is False
          print("INSPECTION_BUNDLE_CLI_SMOKE=PASS")

      - name: Verify installed evidence-layer CLI surfaces
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv
          root = Path(tempfile.mkdtemp())
          isolated = root / "wheel-venv"
          venv.EnvBuilder(with_pip=True).create(isolated)
          scripts = isolated / ("Scripts" if os.name == "nt" else "bin")
          python_cmd = scripts / ("python.exe" if os.name == "nt" else "python")
          scan_cmd = scripts / ("scan.exe" if os.name == "nt" else "scan")
          wheel = next((Path.cwd() / "wheelhouse").glob("*.whl")).resolve()
          subprocess.run([str(python_cmd), "-m", "pip", "install", "--disable-pip-version-check", "--no-deps", str(wheel)], check=True)
          assert scan_cmd.is_file(), scan_cmd
          project = root / "project"
          project.mkdir()
          (project / "app.py").write_text("def value():\n    return 1\n", encoding="utf-8")
          state_path = root / "state.json"
          subprocess.run([scan_cmd, str(project), "--offline", "--baseline", "none", "--no-html", "--state", str(state_path), "--quiet"], check=True)
          state = json.loads(state_path.read_text(encoding="utf-8"))
          artifact = next(row for row in state["artifacts"] if row.get("locator") == "app.py")
          snapshot = state["provenance"]["snapshot_digest"]

          handoff_path = root / "handoff.json"
          handoff = json.loads(subprocess.check_output([scan_cmd, "handoff", str(state_path), "--output", str(handoff_path), "--json"], text=True))
          assert handoff["identity"]["snapshot_digest"] == snapshot
          assert handoff["projection"]["contains_source_bytes"] is False
          assert handoff["projection"]["contains_raw_evidence_results"] is False

          source_digest = "sha256:" + hashlib.sha256(b"installed-federation-source").hexdigest()
          bundle = {
              "scan_evidence_bundle_version": "1",
              "target": {"snapshot_digest": snapshot},
              "producer": {"kind": "external-tool", "name": "CI Specialist", "version": "1"},
              "adapter": {"name": "ci-adapter", "version": "1"},
              "source": {"format": "ci-json", "digest": source_digest},
              "coverage": {"scope": "One installed-wheel federation smoke", "limitations": "Synthetic static evidence only", "whole_project_complete": False},
              "results": [{
                  "external_id": "CI-FED-001",
                  "disposition": "finding",
                  "artifact_locator": "app.py",
                  "artifact_content_identity": artifact["content_identity"],
                  "evidence": {"locator": "app.py:1-2", "kind": "static", "class": "static_semantic", "claim": "Synthetic installed-wheel federation finding", "result": "Bounded synthetic result", "method": "CI adapter fixture", "limitations": "Not independently reproduced"},
                  "finding": {"title": "Synthetic federation finding", "impact": "CI-only impact", "severity": "low", "confidence": "external-tool-reported", "verification_state": "static", "uncertainty": "Synthetic CI fixture", "recommendation": "No production action", "safe_verification": "Repeat the CI smoke"},
              }],
          }
          bundle_path = root / "evidence.json"
          bundle_path.write_text(json.dumps(bundle), encoding="utf-8")
          federated_state_path = root / "federated-state.json"
          federated = json.loads(subprocess.check_output([scan_cmd, "import-evidence", str(state_path), str(bundle_path), "--output", str(federated_state_path), "--json"], text=True))
          assert federated["imported_findings"] == 1
          assert federated["imported_evidence"] == 1
          federated_state = json.loads(federated_state_path.read_text(encoding="utf-8"))
          assert federated_state["coverage"]["analysis_complete"] is False
          assert federated_state["extensions"]["evidence_federation_imports"][-1]["coverage"]["whole_project_complete"] is False

          receipt = {
              "scan_observed_receipt_version": "1",
              "target": {"snapshot_digest": snapshot},
              "executor": {"kind": "external-tool", "name": "CI Runtime", "version": "1"},
              "authorization": {"basis": "CI workflow", "scope": "Synthetic receipt import only", "reference": "validate.yml"},
              "execution": {"execution_id": "ci-observed-1", "started_at": "2026-01-01T00:00:00Z", "completed_at": "2026-01-01T00:00:01Z", "environment": "CI synthetic receipt", "target_executed": False, "network_used": False},
              "coverage": {"scope": "One synthetic observation", "limitations": "No target execution occurred", "whole_project_complete": False},
              "observations": [{
                  "external_id": "CI-OBS-001",
                  "outcome": "pass",
                  "artifact_locator": "app.py",
                  "artifact_content_identity": artifact["content_identity"],
                  "locator": "app.py:1-2",
                  "claim": "Synthetic installed-wheel observed control",
                  "result": "Synthetic observation passed",
                  "method": "External receipt fixture; Scan imports only",
                  "limitations": "No runtime target execution in this smoke",
                  "control": {"description": "Synthetic observation passed", "limitations": "Only this declared case"},
              }],
          }
          receipt_path = root / "observed.json"
          receipt_path.write_text(json.dumps(receipt), encoding="utf-8")
          observed_state_path = root / "observed-state.json"
          observed = json.loads(subprocess.check_output([scan_cmd, "import-observed", str(state_path), str(receipt_path), "--output", str(observed_state_path), "--json"], text=True))
          assert observed["imported_controls"] == 1
          assert observed["imported_evidence"] == 1
          observed_state = json.loads(observed_state_path.read_text(encoding="utf-8"))
          observed_import = observed_state["extensions"]["observed_evidence_imports"][-1]
          assert observed_import["authorization_attestation"]["verified_by_scan"] is False
          assert observed_import["execution"]["target_executed_by_scan_during_import"] is False
          assert observed_import["execution"]["network_used_by_scan_during_import"] is False
          assert observed_state["coverage"]["analysis_complete"] is False
          print("EVIDENCE_LAYER_CLI_SMOKE=PASS")

      - name: Verify installed SARIF import adapter
        shell: python
        run: |
          import json
          from pathlib import Path
          import subprocess
          import tempfile
          root = Path(tempfile.mkdtemp())
          project = root / "project"
          project.mkdir()
          (project / "app.py").write_text("print('ok')\n", encoding="utf-8")
          state = root / "state.json"
          external = root / "external.sarif"
          imported = root / "imported.json"
          report = root / "imported.html"
          subprocess.run(["scan", str(project), "--offline", "--baseline", "none", "--no-html", "--state", str(state), "--quiet"], check=True)
          external.write_text(json.dumps({"version":"2.1.0","runs":[{"tool":{"driver":{"name":"CIExample","semanticVersion":"1.0","rules":[{"id":"EXT001","shortDescription":{"text":"External finding"}}]}},"results":[{"ruleId":"EXT001","ruleIndex":0,"level":"warning","message":{"text":"External static result"},"locations":[{"physicalLocation":{"artifactLocation":{"uri":"app.py"},"region":{"startLine":1}}}]}]}]}), encoding="utf-8")
          subprocess.run(["scan", "import-sarif", str(state), str(external), "--output", str(imported), "--report", str(report), "--json"], check=True)
          payload = json.loads(imported.read_text(encoding="utf-8"))
          assert len(payload["findings"]) == 1
          assert any(row["producer"]["kind"] == "external-tool" for row in payload["evidence"])
          assert report.is_file()
          print("SARIF_IMPORT_CLI_SMOKE=PASS")

      - name: Verify installed local report viewer
        shell: python
        run: |
          import threading
          from pathlib import Path
          import subprocess
          import tempfile
          from urllib.request import urlopen
          from scan_core.serve import create_server
          root = Path(tempfile.mkdtemp())
          project = root / "project"
          project.mkdir()
          (project / "app.py").write_text("print('serve')\n", encoding="utf-8")
          state = root / "state.json"
          subprocess.run(["scan", str(project), "--offline", "--baseline", "none", "--no-html", "--state", str(state), "--quiet"], check=True)
          subprocess.run(["scan", "serve", "--help"], check=True, stdout=subprocess.DEVNULL)
          server, catalog = create_server(state, port=0, quiet=True)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              with urlopen(f"http://127.0.0.1:{server.server_address[1]}/", timeout=3) as response:
                  body = response.read().decode("utf-8")
                  assert response.status == 200 and "Scan report history" in body
              assert len(catalog.entries) == 1
          finally:
              server.shutdown()
              server.server_close()
              thread.join(timeout=3)
          print("LOCAL_VIEWER_SMOKE=PASS")

      - name: Verify reusable GitHub Action receipts
        id: scan-action
        uses: ./
        with:
          path: scanbench/fixtures/clean-minimal/project
          baseline: none
          job-summary: "false"

      - name: Check reusable GitHub Action outputs
        shell: python
        env:
          SCAN_STATE: ${{ steps.scan-action.outputs.state }}
          SCAN_REPORT: ${{ steps.scan-action.outputs.report }}
          SCAN_SARIF: ${{ steps.scan-action.outputs.sarif }}
          SCAN_SUMMARY: ${{ steps.scan-action.outputs.summary }}
          SCAN_FINDINGS: ${{ steps.scan-action.outputs['findings-count'] }}
          SCAN_ANALYSIS_COMPLETE: ${{ steps.scan-action.outputs['analysis-complete'] }}
          SCAN_DELTA_AVAILABLE: ${{ steps.scan-action.outputs['delta-available'] }}
          SCAN_ARTIFACTS_ADDED: ${{ steps.scan-action.outputs['artifacts-added'] }}
        run: |
          import json
          import os
          from pathlib import Path
          paths = [Path(os.environ[name]) for name in ("SCAN_STATE", "SCAN_REPORT", "SCAN_SARIF", "SCAN_SUMMARY")]
          assert all(path.is_file() for path in paths), paths
          sarif = json.loads(Path(os.environ["SCAN_SARIF"]).read_text(encoding="utf-8"))
          assert sarif["version"] == "2.1.0"
          assert os.environ["SCAN_FINDINGS"] == "0"
          assert os.environ["SCAN_ANALYSIS_COMPLETE"] == "false"
          assert os.environ["SCAN_DELTA_AVAILABLE"] == "false"
          assert os.environ["SCAN_ARTIFACTS_ADDED"] == ""
          assert not Path("scanbench/fixtures/clean-minimal/project/.scan").exists()
          print("GITHUB_ACTION_SMOKE=PASS")

      - name: Install optional MCP extra from built wheel
        run: python -c "from pathlib import Path; import subprocess,sys; w=next(Path('wheelhouse').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check',str(w)+'[mcp]'])"

      - name: Verify portable MCP setup and full application on native platform
        run: |
          scan-mcp doctor . --json
          scan-mcp config codex .
          scan-mcp config claude-desktop .
          scan-mcp config claude-code .
          scan-mcp config cursor .
          scan-mcp config vscode .
          python -c "import subprocess; s=subprocess.check_output(['scan-mcp','config','codex','.'], text=True); assert 'scan_core.mcp_app' in s; assert 'scan_core.mcp_server' not in s"

      - name: Run full Core suite on native filesystem
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Run ScanBench v1 on native filesystem
        if: ${{ !cancelled() && steps.install-wheel.outcome == 'success' }}
        run: scan bench

      - name: Run installed v0.6 acceptance matrix
        if: ${{ !cancelled() && steps.install-wheel.outcome == 'success' }}
        run: python scripts/v06_acceptance.py
