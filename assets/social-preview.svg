<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Scan — evidence-backed project inspection</title>
<desc id="desc">Dark navy social preview with Scan positioning and an illustrative evidence dashboard.</desc>
<defs>
