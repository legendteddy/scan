[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-skill"
version = "0.3.0.dev1"
description = "Evidence-backed whole-project inspection core and agent skill"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "legendteddy" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
scan = "scan_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "scanbench_data" = "scanbench"}
packages = ["scan_core", "scan_core.report", "scan_core.schemas", "scanbench_data"]

[tool.setuptools.package-data]
"scan_core.report" = ["*.html"]
"scan_core.schemas" = ["*.json"]
"scanbench_data" = [
  "manifest.json",
  "README.md",
  "fixtures/*/fixture.json",
  "fixtures/*/expected.json",
  "fixtures/*/README.md",
  "fixtures/*/project/*",
  "fixtures/*/project/.*",
  "fixtures/*/project/*/*",
]
