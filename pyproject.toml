[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-skill"
version = "0.3.1"
description = "Evidence-backed whole-project inspection core and agent skill"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "legendteddy" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.urls]
Homepage = "https://github.com/legendteddy/scan"
Repository = "https://github.com/legendteddy/scan"
Issues = "https://github.com/legendteddy/scan/issues"

[project.scripts]
scan = "scan_core.cli:main"
scan-mcp = "scan_core.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src", "scanbench_data" = "scanbench"}
packages = ["scan_core", "scan_core.report", "scan_core.schemas", "scanbench_data", "scanbench_data.fixtures"]

[tool.setuptools.package-data]
"scan_core.report" = ["*.html"]
"scan_core.schemas" = ["*.json"]
"scanbench_data" = [
  "manifest.json",
  "README.md",
  "fixtures/*/fixture.json",
  "fixtures/*/expected.json",
  "fixtures/*/README.md",
  "fixtures/*/project/*",
  "fixtures/*/project/.*",
  "fixtures/*/project/*/*",
]
